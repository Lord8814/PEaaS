services:
  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: apisix
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    volumes:
      - /mnt/apisix/config/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080"     # entry point (appels API)
      - "127.0.0.1:9180:9180"     # admin API (création routes/upstreams)
      - "127.0.0.1:9091:9091"     # metrics Prometheus
    networks:
      - peaas

networks:
  peaas:
    external: true
