services:
  webapp:
    image: node:20-alpine
    container_name: webapp
    deploy:
      resources:
        limits:
          memory: 2g

    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && node server.js"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./app:/app
      - /mnt:/stack:ro
    networks:
      - peaas

networks:
  peaas:
    external: true
