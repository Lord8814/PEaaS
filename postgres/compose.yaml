services:
  postgres:
    image: postgres:16
    container_name: postgres
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
#    ports:   # depublie (durcissement)
#      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - peaas

networks:
  peaas:
    external: true
